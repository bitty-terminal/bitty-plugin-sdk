[plugin]
id = "example.composer-clone"
name = "Conformance Composer Clone (third-party)"
version = "1.0.0"
description = "Third-party composer-clone manifest (W-82, CTX-0068) for parity-denial conformance: identical grants and steps to the first-party composer manifest, proving the same operation is denied identically for both principals."
license = "MIT"

[compat]
bitty = ">=0.5,<1.0"
plugin-api = "^1.0"

[capabilities]
terminal.input.submit = true
process.editor = true
ui.overlay.focus = true

[lazy]
events = [
  "overlay.released",
]

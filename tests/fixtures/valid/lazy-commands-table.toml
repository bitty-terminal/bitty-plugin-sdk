# Valid bitty-plugin.toml using the ADR 0009 table form for [lazy].commands.
# Used by tests/cli.test.ts to prove the CLI accepts mixed string and table
# command declarations with bounded JSON Schema metadata.

[plugin]
id = "xuepoo.example"
name = "Example"
version = "0.1.0"
description = "Example plugin with table-form lazy commands."

[lazy]
commands = [
  "xuepoo.example:ping",
  { id = "xuepoo.example:toggle", args_schema = { type = "object", properties = { value = { type = "string" } }, required = ["value"], additionalProperties = false }, result_schema = { type = "boolean" } },
]
